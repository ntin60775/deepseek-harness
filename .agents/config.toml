# OntoShip role registry.
# One [agents.<name>] section per role; `model` is required.
# Standard DSH layout: the four reviewers and the curator on qwen3.8-flash
# with `xhigh`, the critic on qwen3.8-max with `medium`. `level` is the
# role's reasoning_effort, passed straight to `subagent`.

[agents.reviewer-spec]
model = "qwen-token-plan-max/qwen4-max"
level = "medium"

[agents.reviewer-tests]
model = "qwen-token-plan-glm/glm-5.3"
level = "high"

[agents.reviewer-code]
model = "deepseek-account/deepseek-flash"
level = "max"

[agents.reviewer-kb]
model = "qwen-token-plan/qwen3.8-flash"
level = "xhigh"

[agents.critic]
model = "qwen-token-plan-max/qwen4-max"
level = "xhigh"

[agents.curator]
model = "deepseek-account/deepseek-flash"
level = "low"

[validation]
pool = [
  { model = "deepseek-account/deepseek-flash", level = "max" },
  { model = "qwen-token-plan/qwen3.8-flash", level = "xhigh" },
  { model = "qwen-token-plan-glm/glm-5.3", level = "high" },
]
